<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדיקת האוטומציה - ליד חדש</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f2fb;
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(90, 70, 200, 0.08);
    padding: 32px;
    width: 100%;
    max-width: 460px;
  }

  .icon-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }

  .icon-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #efeafd;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-circle svg {
    width: 28px;
    height: 28px;
  }

  .eyebrow {
    text-align: center;
    color: #6c4fe0;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    color: #1f1b33;
    margin: 0 0 12px;
  }

  .subtitle {
    text-align: center;
    color: #6b6880;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  label {
    display: block;
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .field {
    margin-bottom: 18px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #e3e1f0;
    background: #f7f6fd;
    font-size: 15px;
    color: #1f1b33;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: #7c5cf0;
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #6c4fe0, #8a6df0);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s ease;
  }

  button:hover {
    opacity: 0.92;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .footnote {
    text-align: center;
    font-size: 12px;
    color: #9b98ad;
    margin-top: 16px;
  }

  .status-message {
    text-align: center;
    font-size: 14px;
    margin-top: 16px;
    padding: 10px;
    border-radius: 8px;
    display: none;
  }

  .status-message.success {
    display: block;
    background: #e7f8ee;
    color: #1e8a4c;
  }

  .status-message.error {
    display: block;
    background: #fdecec;
    color: #d33;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12c2-4 6-6 8-6s6 2 8 6c-2 4-6 6-8 6s-6-2-8-6z" stroke="#6c4fe0" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="2.4" stroke="#6c4fe0" stroke-width="1.6"/>
        </svg>
      </div>
    </div>

    <div class="eyebrow">משאירים פרטים, האוטומציה ממשיכה</div>
    <h1>בדיקת האוטומציה – ליד חדש</h1>
    <p class="subtitle">
      השאירו פרטים והלידי ייכנס ישירות אל תהליך<br>
      הh8n שלכם.
    </p>

    <form id="leadForm">
      <div class="field">
        <label for="fullName">שם מלא</label>
        <input type="text" id="fullName" name="fullName" placeholder="נועם" required>
      </div>

      <div class="field">
        <label for="email">אימייל</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="phone">טלפון</label>
        <input type="tel" id="phone" name="phone" placeholder="05XXXXXXXX" required>
      </div>

      <button type="submit" id="submitBtn">
        שלח ליד
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 3L3 10.5l7 3 3 7L21 3z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="status-message" id="statusMessage"></div>
    </form>

    <div class="footnote">השליחה נכנסת ישירות אל תהליך האוטומציה שלכם.</div>
  </div>

  <script>
    const WEBHOOK_URL = "https://n8n.srv1664158.hstgr.cloud/webhook-test/gksbl24";

    const form = document.getElementById("leadForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim()
      };

      submitBtn.disabled = true;
      statusMessage.className = "status-message";
      statusMessage.textContent = "";

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("Request failed with status " + response.status);
        }

        statusMessage.className = "status-message success";
        statusMessage.textContent = "הפרטים נשלחו בהצלחה!";
        form.reset();
      } catch (err) {
        statusMessage.className = "status-message error";
        statusMessage.textContent = "לא הצלחנו לשלוח כרגע. אפשר לנסות שוב בעוד רגע.";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
